name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install PySide6 pyinstaller
      - name: Build single-file exe
        run: pyinstaller --noconfirm --onefile --windowed --name TaskBoard --collect-all tzdata taskboard.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskBoard-windows
          path: dist/TaskBoard.exe
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaskBoard.exe
          tag_name: latest
          name: 最新构建
          prerelease: true
          make_latest: true
          body: |
            自动构建于 ${{ github.event.head_commit.timestamp }}，提交 ${{ github.sha }}
            Windows：解压后把 .env 放在 TaskBoard.exe 旁边再运行。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install PySide6 pyinstaller
      - name: Build single-file binary
        run: pyinstaller --noconfirm --onefile --name TaskBoard --collect-all tzdata taskboard.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskBoard-linux
          path: dist/TaskBoard
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaskBoard
          tag_name: latest
          name: 最新构建
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
