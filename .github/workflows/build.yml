name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/taskboard.exe dist/TaskBoard.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskBoard-windows
          path: dist/TaskBoard.exe
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaskBoard.exe
          tag_name: latest
          name: 最新构建
          prerelease: true
          make_latest: true
          body: |
            自动构建于 ${{ github.event.head_commit.timestamp }}，提交 ${{ github.sha }}
            Rust + Slint 版。Windows：把 .env 放在 TaskBoard.exe 旁边再运行。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            fonts-noto-cjk
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/taskboard dist/TaskBoard
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskBoard-linux
          path: dist/TaskBoard
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaskBoard
          tag_name: latest
          name: 最新构建
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
