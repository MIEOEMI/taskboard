[package]
name = "taskboard"
version = "2.0.0"
edition = "2021"
description = "桌面任务挂件 · Rust + Slint 版（Vikunja 三列看板）"

[[bin]]
name = "taskboard"
path = "src/main.rs"

[dependencies]
slint = { version = "1", features = ["default"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
chrono-tz = "0.10"
fancy-regex = "0.14"
raw-window-handle = "0.6"
tray-icon = "0.21"
muda = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
slint-build = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"